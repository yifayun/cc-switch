name: Build Windows MSI (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-msi

permissions:
  contents: write

concurrency:
  group: build-windows-msi-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  windows-msi-x64:
    name: Windows MSI x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-msi-release
          cache-targets: "true"
          cache-on-failure: "true"

      - name: Install frontend deps
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Disable updater signing for MSI-only build
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(path.read_text(encoding="utf-8"))
          conf.setdefault("bundle", {})["createUpdaterArtifacts"] = False
          # Keep MSI only for this workflow.
          conf["bundle"]["targets"] = ["msi"]
          path.write_text(json.dumps(conf, indent=2) + "\n", encoding="utf-8")
          print("createUpdaterArtifacts=", conf["bundle"]["createUpdaterArtifacts"])
          print("targets=", conf["bundle"]["targets"])
          PY

      - name: Build Windows MSI x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pnpm tauri build --bundles msi 2>&1 | Tee-Object -FilePath build-msi.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host '===== build-msi.log (last 250 lines) ====='
            if (Test-Path build-msi.log) { Get-Content build-msi.log -Tail 250 }
            # Also surface common Rust/WiX error files if present
            Get-ChildItem -Path 'src-tauri/target' -Recurse -Filter '*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 5 | ForEach-Object {
                Write-Host "===== $($_.FullName) (tail) ====="
                Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
              }
            exit $code
          }

      - name: Prepare MSI asset
        id: asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $msi) {
            $msi = Get-ChildItem -Path 'src-tauri/target' -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if ($null -eq $msi) {
            throw 'No Windows MSI found after build'
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $name = "CC-Switch-v$version-Windows.msi"
          Copy-Item $msi.FullName (Join-Path 'release-assets' $name)
          "msi_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-FileHash (Join-Path 'release-assets' $name) -Algorithm SHA256 |
            ForEach-Object { "SHA256=$($_.Hash.ToLower())" } |
            Tee-Object -FilePath (Join-Path 'release-assets' "$name.sha256")

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release with MSI
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-msi-${{ steps.asset.outputs.version }}-${{ github.run_number }}
          name: Windows MSI x64 ${{ steps.asset.outputs.version }} (build ${{ github.run_number }})
          draft: false
          prerelease: true
          files: release-assets/*
          body: |
            Automated Windows **安装版 (.msi) x64** build.

            - File: `${{ steps.asset.outputs.msi_name }}`
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`

            Includes Codex SSH remote sync (gateway + auth).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
